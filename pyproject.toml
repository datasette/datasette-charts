[project]
name = "datasette-charts"
version = "0.1a0"
description = "A charting plugin for Datasette"
readme = "README.md"
authors = [{name = "Datasette"}]
license = "Apache-2.0"
classifiers=[
    "Framework :: Datasette"
]
requires-python = ">=3.11"
dependencies = [
    "datasette>=1.0a44"
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project.urls]
Homepage = "https://github.com/datasette/datasette-charts"
Changelog = "https://github.com/datasette/datasette-charts/releases"
Issues = "https://github.com/datasette/datasette-charts/issues"
CI = "https://github.com/datasette/datasette-charts/actions"

[project.entry-points.datasette]
charts = "datasette_charts"

[tool.setuptools.packages.find]
include = ["datasette_charts*"]

[tool.setuptools.package-data]
datasette_charts = ["static/*", "static/*/*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
